name: Uniswap v3 position check

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "*/10 * * * *"

concurrency:
  group: uniswap-v3-position-check
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI: "true"
      RUN_ONCE: "true"
      RPC: ${{ secrets.RPC }}
      POSITION_V3: ${{ secrets.POSITION_V3 }}
      POOL_V3: ${{ secrets.POOL_V3 }}
      STATE_VIEW_CONTRACT_V3: ${{ secrets.STATE_VIEW_CONTRACT_V3 }}
      CHAIN: ${{ secrets.CHAIN }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run position check
        run: node uniswap_v3.js
